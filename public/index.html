<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AIRDROPS - Instant File Sharing</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script src="https://unpkg.com/lucide@latest"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

import {
getAuth,
signInAnonymously,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

window.FirebaseSDK={
initializeApp,
getFirestore,
collection,
addDoc,
onSnapshot,
getAuth,
signInAnonymously,
onAuthStateChanged
};

</script>

<style>

body{
font-family:Inter,system-ui;
background:linear-gradient(135deg,#0f172a,#1e293b);
}

.glass{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,0.1);
}

</style>

</head>

<body>

<div id="root"></div>

<script type="text/babel">

const {useState,useEffect,useRef}=React;

const firebaseConfig={

apiKey:"AIzaSyC1O9d3mEWJ2hPGTBhj3PRpxx5TqHiDrV4",

authDomain:"airdops-30748.firebaseapp.com",

projectId:"airdops-30748",

storageBucket:"airdops-30748.firebasestorage.app",

messagingSenderId:"301012365212",

appId:"1:301012365212:web:6f3300f519fbb9b51b2259"

};

const app=FirebaseSDK.initializeApp(firebaseConfig);

const db=FirebaseSDK.getFirestore(app);

const auth=FirebaseSDK.getAuth(app);

function Icon({name,size=22}){

return(
<i data-lucide={name}
style={{width:size,height:size}}></i>
);

}

function QR({value}){

const ref=useRef();

useEffect(()=>{

ref.current.innerHTML="";

new QRCode(ref.current,{

text:value,

width:180,

height:180

});

},[value]);

return <div ref={ref}></div>;

}

function App(){

const[user,setUser]=useState(null);

const[session,setSession]=useState("");

const[files,setFiles]=useState([]);

const[view,setView]=useState("landing");

const dropRef=useRef();

useEffect(()=>{

FirebaseSDK.signInAnonymously(auth);

FirebaseSDK.onAuthStateChanged(auth,u=>{

if(u){

setUser(u);

const sid=new URLSearchParams(location.search).get("sid");

if(sid){

setSession(sid);

setView("app");

}

}

});

},[]);

useEffect(()=>{

if(!session)return;

const ref=FirebaseSDK.collection(

db,

"airdrops",

session,

"files"

);

return FirebaseSDK.onSnapshot(ref,snap=>{

const arr=[];

snap.forEach(d=>arr.push({

id:d.id,

...d.data()

}));

setFiles(arr.reverse());

setTimeout(()=>lucide.createIcons(),50);

});

},[session]);

function start(){

const sid=Math.random().toString(36).substr(2,9).toUpperCase();

setSession(sid);

setView("app");

history.pushState({},'',"?sid="+sid);

}

function upload(file){

if(!file)return;

if(file.size>800000){

alert("Max 800kb");

return;

}

const reader=new FileReader();

reader.onload=async()=>{

await FirebaseSDK.addDoc(

FirebaseSDK.collection(

db,

"airdrops",

session,

"files"

),

{

name:file.name,

size:file.size,

type:file.type,

data:reader.result,

sender:user.uid,

time:Date.now()

}

);

};

reader.readAsDataURL(file);

}

function download(file){

const a=document.createElement("a");

a.href=file.data;

a.download=file.name;

a.click();

}

useEffect(()=>{

const drop=dropRef.current;

if(!drop)return;

drop.ondragover=e=>{

e.preventDefault();

drop.classList.add("border-blue-400");

};

drop.ondragleave=e=>{

drop.classList.remove("border-blue-400");

};

drop.ondrop=e=>{

e.preventDefault();

drop.classList.remove("border-blue-400");

upload(e.dataTransfer.files[0]);

};

},[session]);

const url=location.origin+location.pathname+"?sid="+session;

if(view==="landing")

return(

<div className="min-h-screen flex items-center justify-center text-white">

<div className="text-center glass p-10 rounded-3xl">

<div className="mb-4 flex justify-center">

<Icon name="zap" size={60}/>

</div>

<h1 className="text-5xl font-bold mb-4">

AIRDROPS

</h1>

<p className="opacity-70 mb-6">

Instant file sharing

</p>

<button

onClick={start}

className="bg-blue-500 hover:bg-blue-600 px-8 py-4 rounded-xl font-bold">

Start Session

</button>

</div>

</div>

);

return(

<div className="text-white">

<header className="glass p-4 flex justify-between">

<div className="font-bold">

AIRDROPS

</div>

<div className="text-xs">

Session: {session}

</div>

</header>

<div className="grid md:grid-cols-2 gap-6 p-6">

<div className="glass p-6 rounded-xl text-center">

<h2 className="mb-3">

Scan QR

</h2>

<QR value={url}/>

</div>

<div

ref={dropRef}

className="glass p-6 rounded-xl border-2 border-dashed text-center">

<input

type="file"

onChange={e=>upload(e.target.files[0])}

/>

<p className="text-sm opacity-60">

Drag & Drop

</p>

</div>

</div>

<div className="grid md:grid-cols-3 gap-4 p-6">

{files.map(file=>(

<div

key={file.id}

className="glass p-4 rounded-xl">

<div className="mb-2">

{file.name}

</div>

<button

onClick={()=>download(file)}

className="bg-blue-500 px-4 py-2 rounded">

Download

</button>

</div>

))}

</div>

</div>

);

}

ReactDOM.createRoot(

document.getElementById("root")

).render(<App/>);

</script>

</body>
</html>
