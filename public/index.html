<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airdrops - Instant File Sharing</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); }
        .animate-float { animation: float 6s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        window.FirebaseSDK = {
            initializeApp, getFirestore, doc, setDoc, onSnapshot, collection, addDoc, serverTimestamp, deleteDoc, getAuth, signInAnonymously, onAuthStateChanged
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC1O9d3mEWJ2hPGTBhj3PRpxx5TqHiDrV4", 
            authDomain: "airdops-30748.firebaseapp.com",
            projectId: "airdops-30748",
            storageBucket: "airdops-30748.firebasestorage.app",
            messagingSenderId: "301012365212",
            appId: "1:301012365212:web:6f3300f519fbb9b51b2259"
        };

        // Icon Component Helper
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    iconRef.current.innerHTML = lucide.createIcons({
                        icons: { [name]: {} },
                        attrs: { strokeWidth: 2, width: size, height: size }
                    });
                }
            }, [name, size]);
            return <span ref={iconRef} className={`inline-block ${className}`} />;
        };

        // QR Code Component
        const QRCode = ({ value, size = 180 }) => {
            const qrRef = useRef(null);
            useEffect(() => {
                if (qrRef.current) {
                    qrRef.current.innerHTML = "";
                    new QRCodeJS(qrRef.current, {
                        text: value,
                        width: size,
                        height: size,
                        colorDark: "#2563eb",
                        colorLight: "#f8fafc",
                        correctLevel: QRCodeJS.CorrectLevel.H
                    });
                }
            }, [value, size]);
            return <div ref={qrRef} className="p-2 bg-white rounded-xl shadow-inner overflow-hidden" />;
        };

        function App() {
            const [user, setUser] = useState(null);
            const [sessionId, setSessionId] = useState('');
            const [view, setView] = useState('landing');
            const [role, setRole] = useState(null);
            const [files, setFiles] = useState([]);
            const [isUploading, setIsUploading] = useState(false);
            const [notification, setNotification] = useState(null);
            const [db, setDb] = useState(null);
            const [auth, setAuth] = useState(null);

            const appId = "airdrops-30748";

            useEffect(() => {
                if (!window.FirebaseSDK) return;
                const { initializeApp, getAuth, getFirestore, signInAnonymously, onAuthStateChanged } = window.FirebaseSDK;
                
                const app = initializeApp(firebaseConfig);
                const _auth = getAuth(app);
                const _db = getFirestore(app);
                setAuth(_auth);
                setDb(_db);

                const init = async () => {
                    await signInAnonymously(_auth);
                    const params = new URLSearchParams(window.location.search);
                    const sid = params.get('sid');
                    if (sid) {
                        setSessionId(sid);
                        setRole('mobile');
                        setView('app');
                    }
                };

                const unsubscribe = onAuthStateChanged(_auth, (u) => setUser(u));
                init();
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user || !sessionId || view !== 'app' || !db) return;
                const { collection, onSnapshot } = window.FirebaseSDK;

                const filesRef = collection(db, 'artifacts', appId, 'public', 'data', `session_${sessionId}`);
                const unsubscribe = onSnapshot(filesRef, (snapshot) => {
                    const fetchedFiles = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    const sorted = fetchedFiles.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                    setFiles(sorted);
                    cleanupOldFiles(sorted, sessionId);
                });
                return () => unsubscribe();
            }, [user, sessionId, view, db]);

            const cleanupOldFiles = async (currentFiles, sid) => {
                const { deleteDoc, doc } = window.FirebaseSDK;
                const now = Date.now();
                const fiveMinutes = 5 * 60 * 1000;
                for (const file of currentFiles) {
                    if (file.createdAt) {
                        if (now - file.createdAt.toMillis() > fiveMinutes) {
                            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', `session_${sid}`, file.id)).catch(() => {});
                        }
                    }
                }
            };

            const startTransfer = () => {
                const newSid = Math.random().toString(36).substring(2, 9);
                setSessionId(newSid);
                setRole('desktop');
                setView('app');
                window.history.pushState({}, '', `?sid=${newSid}`);
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file || !user) return;
                if (file.size > 800000) {
                    showNotification("File too large (Max 800KB)", "error");
                    return;
                }

                setIsUploading(true);
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const { collection, addDoc, serverTimestamp } = window.FirebaseSDK;
                        const filesRef = collection(db, 'artifacts', appId, 'public', 'data', `session_${sessionId}`);
                        await addDoc(filesRef, {
                            name: file.name,
                            type: file.type,
                            size: file.size,
                            data: event.target.result,
                            createdAt: serverTimestamp(),
                            owner: user.uid
                        });
                        showNotification("Shared successfully!", "success");
                    } catch (err) {
                        showNotification("Upload failed", "error");
                    } finally {
                        setIsUploading(false);
                    }
                };
                reader.readAsDataURL(file);
            };

            const showNotification = (msg, type) => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 3000);
            };

            const downloadFile = (file) => {
                const link = document.createElement('a');
                link.href = file.data;
                link.download = file.name;
                link.click();
            };

            const printFile = (file) => {
                const win = window.open("");
                if (file.type.startsWith('image/')) {
                    win.document.write(`<img src="${file.data}" style="max-width:100%;">`);
                } else {
                    win.document.write(`<iframe src="${file.data}" frameborder="0" style="width:100%; height:100%;"></iframe>`);
                }
                setTimeout(() => { win.print(); win.close(); }, 500);
            };

            const LandingPage = () => (
                <div className="w-full min-h-screen bg-[#0a0c10] text-white overflow-hidden relative">
                    <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600/20 blur-[120px] rounded-full" />
                    <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-indigo-600/20 blur-[120px] rounded-full" />

                    <nav className="relative z-10 max-w-7xl mx-auto px-6 py-8 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="bg-gradient-to-tr from-blue-600 to-indigo-500 p-2.5 rounded-2xl shadow-lg">
                                <Icon name="Zap" className="text-white" />
                            </div>
                            <span className="text-2xl font-black italic">AIRDROPS</span>
                        </div>
                        <button onClick={startTransfer} className="bg-white/5 border border-white/10 px-5 py-2 rounded-full hover:bg-white/10 transition-all text-sm font-medium">
                            Launch App
                        </button>
                    </nav>

                    <div className="relative z-10 max-w-7xl mx-auto px-6 pt-20 pb-32 grid lg:grid-cols-2 gap-16 items-center">
                        <div className="space-y-8 text-center lg:text-left">
                            <div className="inline-flex items-center gap-2 bg-blue-500/10 border border-blue-500/20 px-4 py-1.5 rounded-full text-blue-400 text-sm font-bold">
                                <span className="relative flex h-2 w-2"><span className="animate-ping absolute h-full w-full rounded-full bg-blue-400 opacity-75"></span><span className="relative rounded-full h-2 w-2 bg-blue-500"></span></span>
                                INSTANT SYNC ACTIVE
                            </div>
                            <h1 className="text-6xl md:text-8xl font-black tracking-tighter leading-[0.9]">
                                Transfer files <br /><span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">without cables.</span>
                            </h1>
                            <p className="text-xl text-slate-400 max-w-xl mx-auto lg:mx-0">Scan a QR code to link your phone and desktop instantly. Privacy guaranteed with auto-purge.</p>
                            <button onClick={startTransfer} className="group bg-blue-600 hover:bg-blue-500 px-8 py-4 rounded-2xl font-bold text-lg flex items-center gap-2 transition-all shadow-xl shadow-blue-600/25 mx-auto lg:mx-0">
                                Start Transfer Now <Icon name="ArrowRight" />
                            </button>
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                            <div className="space-y-4 pt-12">
                                <FeatureCard icon="Smartphone" title="Mobile First" desc="Optimized for camera uploads." color="bg-blue-500/5" />
                                <FeatureCard icon="ShieldCheck" title="Self-Destruct" desc="Vanish after 5 mins." color="bg-emerald-500/5" />
                            </div>
                            <div className="space-y-4">
                                <FeatureCard icon="Zap" title="No Accounts" desc="Just scan and share." color="bg-amber-500/5" />
                                <FeatureCard icon="Printer" title="Print Ready" desc="One-click desktop printing." color="bg-purple-500/5" />
                            </div>
                        </div>
                    </div>
                </div>
            );

            const FeatureCard = ({ icon, title, desc, color }) => (
                <div className={`${color} border border-white/5 p-6 rounded-[2rem] backdrop-blur-sm group`}>
                    <div className="bg-white/5 w-12 h-12 rounded-2xl flex items-center justify-center mb-4"><Icon name={icon} /></div>
                    <h3 className="font-bold text-lg mb-1">{title}</h3>
                    <p className="text-sm text-slate-500">{desc}</p>
                </div>
            );

            const AppUI = () => {
                const shareUrl = `${window.location.origin}${window.location.pathname}?sid=${sessionId}`;
                return (
                    <div className="min-h-screen bg-slate-50 text-slate-900 p-4 md:p-8 flex flex-col items-center">
                        <header className="w-full max-w-5xl flex items-center justify-between mb-12">
                            <div className="flex items-center gap-2 pointer-cursor" onClick={() => setView('landing')}>
                                <div className="bg-blue-600 p-2 rounded-xl text-white"><Icon name="Zap" size={20} /></div>
                                <h1 className="text-xl font-black italic tracking-tighter">AIRDROPS</h1>
                            </div>
                            <div className="flex items-center gap-3 bg-white px-4 py-2 rounded-2xl shadow-sm border border-slate-200">
                                <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse" />
                                <span className="text-xs font-bold text-slate-500 uppercase">Session: <span className="text-blue-600">{sessionId}</span></span>
                                <button onClick={() => window.location.href = window.location.origin + window.location.pathname} className="ml-2 text-slate-300 hover:text-red-500"><Icon name="X" size={16} /></button>
                            </div>
                        </header>

                        <main className="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-8">
                            <div className="lg:col-span-4 space-y-6">
                                <div className="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100 flex flex-col items-center">
                                    <h2 className="text-lg font-bold mb-6 self-start flex gap-2"><Icon name="Monitor" className="text-blue-600" /> Connect Mobile</h2>
                                    <QRCode value={shareUrl} />
                                    <p className="text-sm text-slate-500 text-center mt-6">Scan with your phone to start uploading instantly.</p>
                                </div>
                                <div className="bg-gradient-to-br from-indigo-600 to-blue-700 p-8 rounded-[2.5rem] text-white shadow-xl">
                                    <div className="flex items-center gap-3 mb-4"><Icon name="ShieldCheck" /><h2 className="text-lg font-bold">Secure Purge</h2></div>
                                    <p className="text-blue-100/80 text-sm leading-relaxed">Files vanish automatically after 5 minutes of inactivity for your security.</p>
                                </div>
                            </div>

                            <div className="lg:col-span-8 space-y-6">
                                <div className="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100 min-h-[500px]">
                                    <div className="flex items-center justify-between mb-6">
                                        <h2 className="text-xl font-bold">{role === 'mobile' ? 'Upload Center' : 'Received Content'}</h2>
                                        <span className="text-xs font-bold bg-slate-100 text-slate-400 px-3 py-1 rounded-full">{files.length} Files</span>
                                    </div>
                                    <div className="relative border-3 border-dashed border-slate-100 rounded-[2rem] p-10 flex flex-col items-center justify-center hover:border-blue-400 hover:bg-blue-50/30 transition-all">
                                        <input type="file" className="absolute inset-0 opacity-0 cursor-pointer" onChange={handleFileUpload} accept="image/*,application/pdf" disabled={isUploading}/>
                                        <div className={`w-16 h-16 rounded-2xl flex items-center justify-center mb-4 ${isUploading ? 'bg-blue-100 animate-pulse' : 'bg-blue-50 text-blue-600'}`}>
                                            <Icon name={isUploading ? "RefreshCw" : "Upload"} size={32} className={isUploading ? "animate-spin" : ""} />
                                        </div>
                                        <p className="font-bold text-lg text-slate-700">{isUploading ? "Uploading..." : "Select Files"}</p>
                                    </div>

                                    <div className="mt-8 space-y-3">
                                        {files.map(file => (
                                            <div key={file.id} className="bg-slate-50/50 p-4 rounded-2xl border border-slate-100 flex items-center justify-between group">
                                                <div className="flex items-center gap-4">
                                                    <div className="bg-white p-3 rounded-xl shadow-sm text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition-all">
                                                        <Icon name={file.type.includes('image') ? "Image" : "FileText"} size={20} />
                                                    </div>
                                                    <div>
                                                        <h4 className="font-bold text-slate-800 truncate max-w-[150px]">{file.name}</h4>
                                                        <p className="text-[10px] text-slate-400 uppercase">{(file.size / 1024).toFixed(1)} KB • Expiring Soon</p>
                                                    </div>
                                                </div>
                                                <div className="flex gap-1">
                                                    <button onClick={() => downloadFile(file)} className="p-2 text-slate-400 hover:text-blue-600"><Icon name="Download" size={20} /></button>
                                                    <button onClick={() => printFile(file)} className="p-2 text-slate-400 hover:text-indigo-600"><Icon name="Printer" size={20} /></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>
                );
            };

            return (
                <div>
                    {view === 'landing' ? <LandingPage /> : <AppUI />}
                    {notification && (
                        <div className="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-4 rounded-3xl shadow-2xl bg-slate-900 text-white flex items-center gap-3 z-50 animate-bounce">
                            <Icon name={notification.type === 'success' ? "CheckCircle" : "AlertCircle"} className={notification.type === 'success' ? "text-green-400" : "text-red-400"} />
                            <span className="font-bold text-sm">{notification.msg}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
