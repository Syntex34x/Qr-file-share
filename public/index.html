<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AIRDROPS PRO</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script src="https://unpkg.com/lucide@latest"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
background: linear-gradient(135deg,#0f172a,#1e293b);
font-family: Inter;
color:white;
}

.glass{
background: rgba(255,255,255,0.05);
backdrop-filter: blur(15px);
border:1px solid rgba(255,255,255,0.1);
}

</style>

</head>

<body>

<div id="root"></div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
getDoc,
collection,
addDoc,
onSnapshot
}
from
"https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

import {
getAuth,
signInAnonymously,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

import {
getStorage,
ref,
uploadBytes,
getDownloadURL
}
from
"https://www.gstatic.com/firebasejs/11.1.0/firebase-storage.js";

window.FB={
initializeApp,
getFirestore,
doc,
setDoc,
getDoc,
collection,
addDoc,
onSnapshot,
getAuth,
signInAnonymously,
onAuthStateChanged,
getStorage,
ref,
uploadBytes,
getDownloadURL
};

</script>

<script type="text/babel">

const firebaseConfig={

apiKey:"AIzaSyC1O9d3mEWJ2hPGTBhj3PRpxx5TqHiDrV4",
authDomain:"airdops-30748.firebaseapp.com",
projectId:"airdops-30748",
storageBucket:"airdops-30748.firebasestorage.app",
messagingSenderId:"301012365212",
appId:"1:301012365212:web:6f3300f519fbb9b51b2259"

};

const app=FB.initializeApp(firebaseConfig);

const db=FB.getFirestore(app);

const storage=FB.getStorage(app);

const auth=FB.getAuth(app);

const {useState,useEffect,useRef}=React;

function Icon({name,size=22}){

return <i data-lucide={name} style={{width:size,height:size}}></i>;

}

function QR({value}){

const ref=useRef();

useEffect(()=>{

ref.current.innerHTML="";

new QRCode(ref.current,{
text:value,
width:200,
height:200
});

},[value]);

return <div ref={ref}></div>;

}

function App(){

const[user,setUser]=useState(null);

const[session,setSession]=useState("");

const[role,setRole]=useState("");

const[files,setFiles]=useState([]);

const[input,setInput]=useState("");

const[view,setView]=useState("home");

useEffect(()=>{

FB.signInAnonymously(auth);

FB.onAuthStateChanged(auth,u=>{

if(u){

setUser(u);

const saved=localStorage.getItem("session");

if(saved){

joinSession(saved);

}

}

});

},[]);

function createSession(){

const sid=Math.random().toString(36).substr(2,9).toUpperCase();

FB.setDoc(FB.doc(db,"sessions",sid),{

owner:user.uid,

time:Date.now()

});

setSession(sid);

setRole("sender");

setView("room");

localStorage.setItem("session",sid);

}

async function joinSession(id){

const docRef=FB.doc(db,"sessions",id);

const snap=await FB.getDoc(docRef);

if(!snap.exists()){

alert("Session not found");

return;

}

setSession(id);

localStorage.setItem("session",id);

if(snap.data().owner===user.uid)

setRole("sender");

else
setRole("receiver");

setView("room");

listenFiles(id);

}

function listenFiles(id){

const ref=FB.collection(db,"sessions",id,"files");

FB.onSnapshot(ref,snap=>{

let arr=[];

snap.forEach(d=>arr.push({

id:d.id,
...d.data()

}));

setFiles(arr.reverse());

setTimeout(()=>lucide.createIcons(),50);

});

}

async function upload(file){

if(role!=="sender"){

alert("Only sender can upload");

return;

}

const storageRef=FB.ref(storage,
"sessions/"+session+"/"+file.name);

await FB.uploadBytes(storageRef,file);

const url=await FB.getDownloadURL(storageRef);

await FB.addDoc(

FB.collection(db,"sessions",session,"files"),

{

name:file.name,
url:url,
type:file.type,
time:Date.now()

}

);

}

function printFile(url){

const win=window.open(url);

win.print();

}

const shareURL=
location.origin+location.pathname+"?sid="+session;

if(view==="home")

return(

<div className="min-h-screen flex items-center justify-center">

<div className="glass p-10 rounded-xl w-96">

<h1 className="text-3xl mb-6 font-bold text-center">

AIRDROPS PRO

</h1>

<button
onClick={createSession}
className="w-full bg-blue-500 p-3 rounded mb-4">

Start as Sender

</button>

<input
value={input}
onChange={e=>setInput(e.target.value)}
placeholder="Enter Session ID"
className="w-full p-3 rounded bg-black mb-4"
/>

<button
onClick={()=>joinSession(input)}
className="w-full bg-green-500 p-3 rounded">

Join Session

</button>

</div>

</div>

);

return(

<div className="p-6">

<div className="glass p-4 flex justify-between mb-4">

<div>

Session: {session}

</div>

<div>

Role: {role}

</div>

</div>

{role==="sender" &&

<div className="glass p-4 mb-4">

<input
type="file"
onChange={e=>upload(e.target.files[0])}
/>

</div>

}

<div className="glass p-4 mb-4">

<QR value={shareURL}/>

</div>

<div className="grid md:grid-cols-3 gap-4">

{files.map(f=>(

<div className="glass p-4">

<div>{f.name}</div>

<a
href={f.url}
download
className="bg-blue-500 block p-2 mt-2 text-center rounded">

Download

</a>

<button
onClick={()=>printFile(f.url)}
className="bg-green-500 block w-full p-2 mt-2 rounded">

Print

</button>

</div>

))}

</div>

</div>

);

}

ReactDOM.createRoot(
document.getElementById("root")
).render(<App/>);

</script>

</body>
</html>
